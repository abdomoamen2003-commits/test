  function scrollShapes(){liveEls.forEach(function(el){var r=el.getBoundingClientRect();el.style.setProperty('--mx-py',((r.top+r.height/2-innerHeight/2)*-.14).toFixed(1));});}
  function scanBg(){document.querySelectorAll('section.bp,section.bp-light,footer,main>header').forEach(function(el){if(!bgSeen.has(el)){bgSeen.add(el);live.observe(el);}});}

  function scan(){
    scanBg();
    document.querySelectorAll('.imgbox').forEach(function(el){
      var a=el.closest('[data-aos]');
      var d=a?(parseInt(a.getAttribute('data-aos-delay')||'0',10)/1000):0;
      prep(el,d+.2);
    });
    staggered.forEach(function(sel){
      document.querySelectorAll(sel).forEach(function(el){prep(el,idx(el)*.09);});
    });
    document.querySelectorAll('[data-reveal]').forEach(function(el){prep(el,idx(el)*.09);});
    document.querySelectorAll('[data-stagger]>*').forEach(function(el){prep(el,idx(el)*.09);});
  }

  /* hover must not inherit the entrance stagger delay once the entrance is done */
  document.addEventListener('transitionend',function(e){
    var t=e.target;
    if(t&&t.hasAttribute&&t.hasAttribute('data-aos')&&e.propertyName==='opacity'){
      if(t.classList.contains('aos-animate'))t.setAttribute('data-mx-done','');
      else t.removeAttribute('data-mx-done');
    }
  },true);

  /* light parallax on inner-page header image (desktop only, rAF-throttled) */
  var ticking=false;
  function parallax(){
    ticking=false;
    scrollShapes();
    var img=document.querySelector('main>header>img');
    if(!img)return;
    if(innerWidth<768||scrollY>900){img.style.transform='';return;}
    img.style.transform='translate3d(0,'+Math.min(scrollY*.12,26).toFixed(1)+'px,0)';
  }
  addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(parallax);}},{passive:true});

  var queued=false;
  function schedule(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;scan();});}
  var root=document.getElementById('root')||document.body;
  new MutationObserver(schedule).observe(root,{childList:true,subtree:true});
  scan();

  /* safety net: anything already on screen but still waiting is revealed, so content can never stay hidden */
  setInterval(function(){
    document.querySelectorAll('[data-mx=pre]').forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.bottom>0&&r.top<innerHeight)el.setAttribute('data-mx','in');
    });
  },700);

  addEventListener('beforeprint',function(){
    document.querySelectorAll('[data-mx=pre]').forEach(function(el){el.setAttribute('data-mx','in');});
  });
})();
</script>
<script id="mx-hero-gradient">(function(){
  var G='linear-gradient(90deg,#ffffff 0%,#38A6BD 45%,#EC9510 100%)';
  if(!(window.CSS&&CSS.supports&&(CSS.supports('-webkit-background-clip','text')||CSS.supports('background-clip','text'))))return;
  function run(){
    var h=document.querySelector('h1.t-hero');if(!h)return;
    var cs=h.querySelectorAll('.char');if(!cs.length)return;
    var min=1e9,max=0;
    cs.forEach(function(c){min=Math.min(min,c.offsetLeft);max=Math.max(max,c.offsetLeft+c.offsetWidth);});
    var w=Math.max(max-min,1);
    cs.forEach(function(c){var st=c.style;
      st.backgroundImage=G;st.backgroundSize=w+'px 100%';st.backgroundRepeat='no-repeat';
      st.backgroundPosition=(-(c.offsetLeft-min))+'px 0';
      st.webkitBackgroundClip='text';st.backgroundClip='text';st.color='transparent';st.webkitTextFillColor='transparent';});
  }
  var q=false;function later(){if(q)return;q=true;requestAnimationFrame(function(){q=false;run();});}
  new MutationObserver(later).observe(document.getElementById('root')||document.body,{childList:true,subtree:true});
  addEventListener('resize',later);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(later);
  later();
})();</script>
  <script id="mx-page-loader">(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var el=document.createElement('div');el.id='mx-loader';el.setAttribute('aria-hidden','true');el.innerHTML='<i></i>';
  document.body.appendChild(el);
  var hideT,busy=false;
  function show(){clearTimeout(hideT);el.classList.add('on');hideT=setTimeout(hide,2500);}   /* safety: never stay on */
  function hide(){clearTimeout(hideT);el.classList.remove('on');busy=false;}
  addEventListener('click',function(e){
    if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    var a=e.target.closest&&e.target.closest('a[href^="#/"]');
    if(!a||a.target==='_blank')return;
    var to=a.getAttribute('href');
    if(to===location.hash||busy)return;
    e.preventDefault();e.stopPropagation();
    busy=true;show();
    setTimeout(function(){location.hash=to;},320);
  },true);
  addEventListener('hashchange',function(){
    if(!busy)show();                      /* browser back/forward */
    clearTimeout(hideT);hideT=setTimeout(hide,520);   /* page has rendered underneath */
  });
})();</script>
