# =============================================================================
#  El Halfawy — production nginx server block
#  Target: nginx 1.18+ (Ubuntu 20.04/22.04 packages) — tested against the same
#  behaviour this build was QA'd on: gzip for text, immutable cache for the
#  hash-named image/font files, no-cache for the HTML document.
#
#  Install:  sudo cp deploy/nginx-elhalfawy.conf /etc/nginx/sites-available/elhalfawy
#            sudo ln -s /etc/nginx/sites-available/elhalfawy /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
#
#  Document root = the optimised build output (dist/), uploaded as the site root:
#            sudo rsync -a --delete dist/ /var/www/elhalfawy/
# =============================================================================

# --- gzip -------------------------------------------------------------------
# Biggest single win on this site: the HTML document is 420 KB raw but 134 KB
# gzipped, because the app bundle + inline CSS compress well.
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   512;
gzip_proxied      any;
gzip_types        text/plain text/css text/xml application/javascript
                  application/json application/xml image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name www.elhalfawy.com elhalfawy.com;

    # Everything below is also valid for the TLS vhost — copy the location
    # blocks into the 443 server after running certbot.
    # return 301 https://www.elhalfawy.com$request_uri;

    root  /var/www/elhalfawy;
    index index.html;

    charset utf-8;
    server_tokens off;

    # --- security headers ---------------------------------------------------
    add_header X-Content-Type-Options      "nosniff"            always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options             "SAMEORIGIN"         always;
    add_header Permissions-Policy          "geolocation=(), microphone=(), camera=()" always;
    # The site only loads its own files plus the Google Maps embed on /contact.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://www.google.com; connect-src 'self' https://formsubmit.co; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # --- immutable hashed assets -------------------------------------------
    # Every file in /img/ and /fonts/ carries a content hash in its name, so it
    # can be cached for a year and never revalidated.
    location ^~ /img/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- the document itself -----------------------------------------------
    # No hash in the filename, so it must be revalidated on every visit:
    # a deploy is live immediately without a cache-busting query string.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";

        # SPA fallback. The app uses a HASH router (#/about, #/services, ...),
        # so deep links already resolve to this one document and this line is
        # not strictly required — it is here so the site keeps working if the
        # router is ever switched to history mode.
        try_files $uri $uri/ /index.html;
    }

    # Small static files that change rarely but are not hash-named.
    location ~* \.(?:ico|png|jpg|jpeg|svg|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Never serve the QA/build tooling even if it is uploaded by mistake.
    location ~ ^/(tools|_audit|_qa)/ { deny all; }
}
